version: "3.9"

name: rinha-2026-go
services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          # cpus: "0.10"
          memory: "30M"

  api1:
    image: lukebarros/rinha-2026-go:latest
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9999/ready"]
      interval: 5s
      timeout: 10s
      retries: 60
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    image: lukebarros/rinha-2026-go:latest
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9999/ready"]
      interval: 5s
      timeout: 10s
      retries: 60
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

networks:
  default:
    driver: bridge