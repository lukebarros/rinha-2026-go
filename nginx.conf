worker_processes 1;
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}
http {
    access_log off;
    error_log  /dev/null crit;
    keepalive_timeout 65;
    keepalive_requests 10000;

    upstream api {
        server api1:9999;
        server api2:9999;
        keepalive 64;
    }
    server {
        listen 9999;
        location / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_buffering    off;
        }
    }
}